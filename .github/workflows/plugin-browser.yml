name: Browser plugin

on:
  pull_request:
    branches: [main]
    # `synchronize` is required because this job is a required status check: a
    # `ready_for_review`-only trigger would leave the previous run's verdict in
    # place after a new commit, which is a stale pass.
    types: [ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: browser-plugin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chrome smoke
    if: vars.CI_BILLING_PAUSED != 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # This repository installs with bun (bun.lock is committed and packageManager
      # pins bun@1.4.0). `cache: npm` hard-fails here because no npm lockfile
      # exists, and `npm ci` cannot resolve without one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Test packed plugin without Pi against a loopback browser fixture
        run: bun run test:browser
