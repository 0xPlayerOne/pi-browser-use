name: Browser plugin

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: browser-plugin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chrome smoke
    if: vars.CI_BILLING_PAUSED != 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test packed plugin without Pi against a loopback browser fixture
        run: npm run test:browser
